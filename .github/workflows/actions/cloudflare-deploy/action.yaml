name: "Deploy to Cloudflare"
description: "Builds and deploys to Cloudflare"

inputs:
  cloudflare_account_id:
    required: true
    description: "Cloudflare account ID for deployment"
  cloudflare_api_token:
    required: true
    description: "Cloudflare API token for deployment"
  deploy_env:
    required: true
    description: "The environment to deploy to (e.g., prod, dev)"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Deploy to Cloudflare
      run: pnpx wrangler deploy --env=${{ inputs.deploy_env }}
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
