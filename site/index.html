<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zipper to Thread Mappings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>YKK Zipper color to matching thread color selection guide</h1>
        <p>
          Based on the
          <a
            href="https://www.wawak.com/490246/globalassets/documents/waw_pim/nz3/zipper-to-thread-color-selection-guide"
            >Wawak guide of the same name</a
          >, but in a more visual form.
        </p>
        <p>All images are hyperlinks to the matching product on Wawak.</p>
      </header>

      <div class="table-wrap">
        <table id="mapping-table" aria-label="Zipper to thread mapping table">
          <thead>
            <tr>
              <th>Zipper</th>
              <th>Thread 1</th>
              <th>Thread 2</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="status" class="status">Loading mapping data...</div>
    </div>

    <script>
      async function renderMappings() {
        const statusEl = document.getElementById("status");
        try {
          const response = await fetch("data.json");
          if (!response.ok) throw new Error("Unable to load data.json.");
          const data = await response.json();

          const threadColumns = data.threads || [];
          const zipperIndex = new Map(
            (data.zippers || []).map((item) => [item.id, item]),
          );
          const threadColorIndex = new Map(
            (data.threadColors || []).map((item) => [item.id, item]),
          );
          const tbody = document.querySelector("#mapping-table tbody");

          const headerRow = document.querySelector("#mapping-table thead tr");
          headerRow.innerHTML =
            "<th>Zipper</th>" +
            threadColumns.map((thread) => `<th>${thread.name}</th>`).join("");

          if (!data.mappings?.length) {
            statusEl.textContent = "No mappings found in data.json.";
            return;
          }

          data.mappings.forEach((mapping) => {
            const zipper = zipperIndex.get(mapping.zipper);
            const row = document.createElement("tr");

            const zipperCell = document.createElement("td");
            zipperCell.innerHTML = renderImageLink(
              "zippers",
              zipper?.id,
              zipper?.link,
              zipper?.color || "Zipper",
              zipper?.color,
            );
            row.appendChild(zipperCell);

            const mappedThreadColors = mapping.threadColors || [];
            threadColumns.forEach((thread) => {
              const threadCell = document.createElement("td");
              const matchedThreadColor = mappedThreadColors
                .map((colorId) => threadColorIndex.get(colorId))
                .find((color) => color?.thread === thread.id);

              if (matchedThreadColor) {
                threadCell.innerHTML = renderImageLink(
                  thread.imageFolder,
                  matchedThreadColor.id,
                  `${thread.link}#sku=${matchedThreadColor.id}`,
                  matchedThreadColor.id.toUpperCase() || "Thread",
                  matchedThreadColor.id.toUpperCase(),
                );
              } else {
                threadCell.textContent = "—";
                threadCell.style.color = "#7d8597";
                threadCell.style.textAlign = "center";
              }
              row.appendChild(threadCell);
            });

            tbody.appendChild(row);
          });

          statusEl.textContent = `${data.mappings.length} mapping(s) loaded.`;
        } catch (error) {
          if (location.protocol === "file:") {
            statusEl.innerHTML = `<span class="error">Cannot load data.json from file://. Run a local HTTP server and open via http://localhost.</span>`;
          } else {
            statusEl.innerHTML = `<span class="error">${error.message}</span>`;
          }
        }
      }

      function renderImageLink(base, id, link, altText, caption) {
        if (!link) {
          return '<span style="color:#7d8597">Missing link</span>';
        }
        return `
          <a class="image-link" href="${link}" target="_blank" rel="noopener noreferrer">
              <img src="images/${base}/${id}.webp" alt="${altText}" loading="lazy" />
            ${caption ? `<div class="image-caption">${caption}</div>` : ""}
          </a>
        `;
      }

      renderMappings();
    </script>
  </body>
</html>
